[project]
name = "document-ingestion-adapter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tersugh", email = "iorbeealbert@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.0",
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
]

[project.scripts]
document-ingestion-adapter = "document_ingestion_adapter:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
